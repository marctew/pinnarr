services:
  pinnarr:
    image: ghcr.io/marctew/pinnarr:latest
    # To build locally instead of pulling, comment the image line and use:
    # build: .
    container_name: pinnarr
    restart: unless-stopped
    ports:
      - "8737:8737"
    env_file: .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8737/healthz', timeout=4).status==200 else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
