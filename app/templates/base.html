<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pinnarr{% endblock %}</title>
<style>
  /* No build step and no CDN: this box may not have internet, and a
     self-hosted panel that breaks without it would be a poor trade. */
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #14181d; --muted: #5d6874;
    --line: #dfe3e8; --accent: #3b6fd4; --ok: #1a7f4b; --bad: #b3261e;
    --warn: #8a6100;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d; --panel: #1c2128; --ink: #e6edf3; --muted: #9aa7b4;
      --line: #2d353e; --accent: #6f9ceb; --ok: #4ac48a; --bad: #f0857d;
      --warn: #e0b341;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 1.5rem;
    padding: 0 1.25rem; height: 52px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header .brand { font-weight: 700; letter-spacing: .14em; font-size: 13px; }
  header nav a {
    color: var(--muted); text-decoration: none; font-size: 14px; margin-right: 1rem;
  }
  header nav a.active { color: var(--ink); font-weight: 600; }
  header .who-nav { margin-left: auto; display: flex; align-items: center; gap: .9rem; }
  header .who-nav a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header .who-nav a:hover { color: var(--ink); }
  .linkish {
    background: none; border: 0; padding: 0; color: var(--muted);
    font: inherit; font-size: 14px; cursor: pointer;
  }
  .linkish:hover { color: var(--ink); }
  .gate { max-width: 340px; margin: 3rem auto; }
  .gate label { display: block; margin-bottom: .9rem; }
  .users { width: 100%; border-collapse: collapse; font-size: 14px; }
  .users th {
    text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); padding: .4rem .5rem; border-bottom: 1px solid var(--line);
  }
  .users td { padding: .45rem .5rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .users td.right { text-align: right; white-space: nowrap; }
  .users .topic { color: var(--muted); }
  .users .you {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--accent); margin-left: .4rem;
  }
  .inline { display: inline-flex; gap: .3rem; align-items: center; }
  .inline input { width: 9rem; margin: 0; padding: .3rem .4rem; font-size: 13px; }
  .inline select { width: auto; margin: 0; padding: .25rem .4rem; font-size: 13px; }
  button.danger { border-color: var(--bad); color: var(--bad); }
  button.danger:hover { background: var(--bad); color: #fff; }
  main { max-width: 780px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  main.wide { max-width: 1400px; }
  h1 { font-size: 20px; margin: 0 0 .25rem; }
  h2 { font-size: 15px; margin: 0; }
  .lede { color: var(--muted); margin: 0 0 1.5rem; }
  fieldset {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 1rem 1.15rem 1.15rem; margin: 0 0 1rem;
  }
  legend { padding: 0 .4rem; font-weight: 600; font-size: 14px; }
  label { display: block; margin: .8rem 0 0; font-size: 13px; color: var(--muted); }
  input[type=text], input[type=password], input[type=url], input[type=number], select {
    width: 100%; margin-top: .3rem; padding: .5rem .6rem;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 14px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: .9rem; flex-wrap: wrap; }
  .row > label { flex: 1 1 200px; }
  .check { display: flex; align-items: center; gap: .5rem; margin-top: .9rem;
           font-size: 14px; color: var(--ink); }
  .check input { margin: 0; }
  .hint { font-size: 12px; color: var(--muted); margin: .35rem 0 0; }
  button {
    font: inherit; font-size: 14px; padding: .45rem .9rem; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bar {
    position: sticky; bottom: 0; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
    padding: .75rem 1rem; display: flex; align-items: center; gap: 1rem;
  }
  .flash {
    padding: .6rem .9rem; border-radius: 8px; margin: 0 0 1rem; font-size: 14px;
    border: 1px solid var(--line); background: var(--panel);
  }
  .flash.ok  { border-color: var(--ok);  color: var(--ok); }
  .flash.bad { border-color: var(--bad); color: var(--bad); }
  .legend-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .result { font-size: 13px; margin-top: .7rem; }
  .result.ok  { color: var(--ok); }
  .result.bad { color: var(--bad); }
  .result.pending { color: var(--muted); }
  .sections { margin-top: .6rem; padding-left: .1rem; }
  .sections label {
    display: flex; align-items: center; gap: .5rem; color: var(--ink); margin: .3rem 0;
  }
  .sections .agent { color: var(--muted); font-size: 12px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }

  /* ── Library ── */
  .library { display: grid; grid-template-columns: 220px 1fr; gap: 1.5rem; align-items: start; }
  .rail {
    position: sticky; top: 1rem; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: .9rem; max-height: calc(100vh - 5rem); overflow-y: auto;
  }
  .rail input[type=search] {
    width: 100%; padding: .45rem .55rem; font: inherit; font-size: 14px;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
  }
  .facet { margin-top: 1rem; }
  .facet h3 {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 .4rem;
  }
  .facet label {
    display: flex; align-items: center; gap: .45rem; margin: .15rem 0;
    font-size: 13px; color: var(--ink); cursor: pointer;
  }
  .facet label span:first-of-type { flex: 1; overflow: hidden; text-overflow: ellipsis;
                                    white-space: nowrap; }
  .facet .n { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .rail .clear { display: inline-block; margin-top: 1rem; font-size: 13px; color: var(--accent); }
  .toolbar {
    display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
    padding-bottom: .8rem; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .toolbar .spacer { flex: 1; }
  .toolbar select { width: auto; margin: 0 0 0 .35rem; padding: .3rem .4rem; }
  .sort { display: flex; align-items: center; margin: 0; font-size: 13px; }
  .grid {
    display: grid; gap: 1rem; margin-top: 1rem;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  }
  .card h4 { font-size: 13px; margin: .45rem 0 0; font-weight: 600; line-height: 1.3; }
  .card .year { color: var(--muted); font-weight: 400; }
  /* The pin is anchored to the thumbnail, not the card — anchored to the
     card it drifts down onto the title as soon as one wraps to two lines. */
  .card .thumb {
    position: relative; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden;
    background: var(--panel);
  }
  .card .poster { display: block; width: 100%; height: 100%; text-decoration: none; }
  .card .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .thumb:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* A corner fold: a triangle clipped into the bottom-right of the artwork,
     so it reads as part of the thumbnail rather than something dropped on it. */
  .card .pin {
    position: absolute; right: 0; bottom: 0; width: 54px; height: 54px;
    padding: 0; border: 0; cursor: pointer; background: rgba(0, 0, 0, .6);
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
    display: grid; place-items: end; transition: background .12s;
  }
  .card .pin .glyph {
    font-size: 15px; line-height: 1; transform: translate(-5px, -4px);
    filter: grayscale(1) opacity(.85);
  }
  .card .pin:hover { background: rgba(0, 0, 0, .85); }
  .card.is-pinned .pin { background: var(--accent); }
  .card.is-pinned .pin:hover { background: var(--accent); filter: brightness(1.15); }
  .card.is-pinned .pin .glyph { filter: none; }
  .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
  .card.is-pinned .thumb { outline: 2px solid var(--accent); outline-offset: 1px; }
  .badge { font-size: 11.5px; color: var(--muted); margin: .2rem 0 0; }
  .badge.outlook-dated { color: var(--accent); }
  .badge.outlook-dormant { color: var(--warn); }
  .badge.outlook-cancelled { color: var(--bad); }
  .pager { display: flex; align-items: center; gap: 1rem; justify-content: center;
           margin-top: 1.5rem; font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); margin-top: 2rem; }
  /* ── Calendar ── */
  .day { margin: 0 0 .3rem; }
  .day-head {
    display: flex; align-items: baseline; gap: .45rem; margin: 1.1rem 0 .3rem;
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted);
  }
  .day-head .dnum { font-size: 15px; color: var(--ink); letter-spacing: 0; }
  .day-head .rel {
    margin-left: auto; text-transform: none; letter-spacing: 0;
    font-weight: 400; font-size: 12px; opacity: .8;
  }
  .eps { list-style: none; padding: 0; margin: 0; }
  .eps.flat { margin-top: .5rem; }
  /* Fixed columns for code and state: sized to the widest value either can
     take, so a row saying "not arrived" lines up with one saying "upcoming"
     instead of shoving the episode number sideways. */
  .ep {
    display: grid; grid-template-columns: 36px 1fr 3.4rem 5.5rem 7.5rem; gap: .8rem;
    align-items: center; padding: .3rem .5rem; border-radius: 8px; font-size: 14px;
    border-left: 3px solid transparent;
  }
  .ep:hover { background: var(--panel); }
  .ep .art { display: block; line-height: 0; }
  .ep .art img {
    width: 36px; height: 54px; object-fit: cover; border-radius: 4px;
    background: var(--panel);
  }
  .ep .who { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
  .ep .show { color: var(--ink); text-decoration: none; font-weight: 600; }
  .ep .show:hover { color: var(--accent); }
  .ep .eptitle {
    color: var(--muted); font-size: 12.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ep .time, .ep .code {
    color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px;
    text-align: right;
  }
  .ep .time { font-size: 12.5px; opacity: .8; }
  .ep .pill {
    justify-self: end; font-size: 11.5px; white-space: nowrap; padding: .18rem .5rem;
    border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
    width: 100%; text-align: center;
  }
  .ep.state-available { border-left-color: var(--ok); }
  .ep.state-available .pill { color: var(--ok); border-color: var(--ok); }
  .ep.state-missing { border-left-color: var(--bad); }
  .ep.state-missing .pill { color: var(--bad); border-color: var(--bad); }
  .ep.state-awaiting { border-left-color: var(--warn); }
  .ep.state-awaiting .pill { color: var(--warn); border-color: var(--warn); }
  .ep.state-airing_today { border-left-color: var(--accent); }
  .ep.state-airing_today .pill { color: var(--accent); border-color: var(--accent); }
  .section {
    font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin: 2.25rem 0 .6rem; font-weight: 600;
  }
  .section.warn { color: var(--warn); }
  .section .nav { color: var(--accent); text-decoration: none; padding: 0 .4rem; }
  /* Real grid rather than a table: a table sizes columns to their content,
     so a long show name widened the column and the ellipsis never engaged.
     Grid also lets the cells stay square at any width. */
  .month { margin-bottom: .5rem; }
  .dow-head, .month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .dow-head span {
    font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); text-align: center; padding-bottom: .35rem;
  }
  .cell {
    aspect-ratio: 1; min-width: 0; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: .25rem .3rem; display: flex; flex-direction: column; gap: .1rem;
  }
  .cell.dim { background: transparent; }
  .cell.dim .num { opacity: .35; }
  .cell .num { text-align: right; color: var(--muted); font-size: 11px; flex: none; }
  .cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cell.today .num {
    color: #fff; background: var(--accent); border-radius: 999px;
    align-self: flex-end; min-width: 17px; text-align: center;
    line-height: 17px; font-weight: 600;
  }
  .cell-show {
    display: block; min-width: 0; font-size: 10.5px; line-height: 1.3; color: var(--ink);
    text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    border-left: 2px solid var(--accent); padding-left: .25rem;
  }
  .cell-show:hover { color: var(--accent); }
  .cell-show.state-available { border-left-color: var(--ok); }
  .cell-show.state-missing { border-left-color: var(--bad); }
  .cell-show.state-awaiting { border-left-color: var(--warn); }
  .cell .more { font-size: 10px; color: var(--muted); padding-left: .25rem; }

  /* ── Calendar layout ── */
  .cal { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(340px, 1fr); gap: 2.5rem; align-items: start; }
  .cal-main { min-width: 0; }
  .cal-side { min-width: 0; position: sticky; top: 1rem; }
  .cal-side .section:first-child { margin-top: 0; }
  @media (max-width: 1100px) {
    .cal { grid-template-columns: 1fr; gap: 0; }
    .cal-side { position: static; }
  }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0 0 1rem; }
  .chip {
    font-size: 13px; padding: .2rem .55rem; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel);
  }
  .dormant summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 1.5rem; }
  /* ── Series detail ── */
  .crumb { margin: 0 0 1rem; font-size: 13px; }
  .crumb a { color: var(--accent); text-decoration: none; }
  .detail { display: grid; grid-template-columns: 200px 1fr; gap: 1.5rem; align-items: start; }
  .detail .art { border-radius: 8px; background: var(--panel); object-fit: cover; }
  .detail h1 { margin: 0; }
  .detail .year { color: var(--muted); font-weight: 400; }
  .detail .overview { margin: 1rem 0; max-width: 60ch; }
  .badge-lg {
    font-size: 12px; padding: .2rem .55rem; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  }
  .badge-lg.outlook-dated { color: var(--accent); border-color: var(--accent); }
  .badge-lg.outlook-dormant { color: var(--warn); border-color: var(--warn); }
  .badge-lg.outlook-cancelled { color: var(--bad); border-color: var(--bad); }
  .detail .next { color: var(--muted); font-size: 13px; margin-left: .5rem; }
  .detail .actions { margin: 1rem 0; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .ext {
    font-size: 13px; padding: .4rem .7rem; border-radius: 6px; text-decoration: none;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .ext:hover { border-color: var(--accent); color: var(--accent); }
  .facts { display: grid; grid-template-columns: 8rem 1fr; gap: .3rem 1rem; font-size: 13px; margin: 0; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; }
  .facts .soft { color: var(--warn); margin-left: .4rem; }
  .card h4 a { color: inherit; text-decoration: none; }
  .card h4 a:hover { color: var(--accent); }
  .card { position: relative; }
  a.chip { text-decoration: none; color: var(--ink); }
  a.chip:hover { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 820px) {
    .detail { grid-template-columns: 1fr; }
  }
  .dormant summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 1.5rem; }
  @media (max-width: 820px) {
    .ep { grid-template-columns: 30px 1fr auto; gap: .6rem; }
    .ep .time { display: none; }
    .ep .code { grid-column: 3; }
    .ep .pill { grid-column: 2 / 4; justify-self: start; width: auto; }
    .month td { height: 58px; font-size: 11px; }
    .library { grid-template-columns: 1fr; }
    .rail { position: static; max-height: none; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">PINNARR</span>
  <nav>
    <a href="/" class="{% block nav_calendar %}{% endblock %}">Calendar</a>
    <a href="/library" class="{% block nav_library %}{% endblock %}">Library</a>
    {% if current_user(request) and current_user(request)['role'] == 'admin' %}
      <a href="/settings" class="{% block nav_settings %}{% endblock %}">Settings</a>
    {% endif %}
    <a href="/healthz">Health</a>
  </nav>
  {% if current_user(request) %}
    <div class="who-nav">
      <a href="/profile">{{ current_user(request)['username'] }}</a>
      <form method="post" action="/logout"><button type="submit" class="linkish">Sign out</button></form>
    </div>
  {% endif %}
</header>
<main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
</body>
</html>
