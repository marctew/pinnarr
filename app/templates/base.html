<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pinnarr{% endblock %}</title>
<style>
  /* No build step and no CDN: this box may not have internet, and a
     self-hosted panel that breaks without it would be a poor trade. */
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #14181d; --muted: #5d6874;
    --line: #dfe3e8; --accent: #3b6fd4; --ok: #1a7f4b; --bad: #b3261e;
    --warn: #8a6100;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d; --panel: #1c2128; --ink: #e6edf3; --muted: #9aa7b4;
      --line: #2d353e; --accent: #6f9ceb; --ok: #4ac48a; --bad: #f0857d;
      --warn: #e0b341;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 1.5rem;
    padding: 0 1.25rem; height: 52px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header .brand { font-weight: 700; letter-spacing: .14em; font-size: 13px; }
  header nav a {
    color: var(--muted); text-decoration: none; font-size: 14px; margin-right: 1rem;
  }
  header nav a.active { color: var(--ink); font-weight: 600; }
  main { max-width: 780px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  main.wide { max-width: 1400px; }
  h1 { font-size: 20px; margin: 0 0 .25rem; }
  h2 { font-size: 15px; margin: 0; }
  .lede { color: var(--muted); margin: 0 0 1.5rem; }
  fieldset {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 1rem 1.15rem 1.15rem; margin: 0 0 1rem;
  }
  legend { padding: 0 .4rem; font-weight: 600; font-size: 14px; }
  label { display: block; margin: .8rem 0 0; font-size: 13px; color: var(--muted); }
  input[type=text], input[type=password], input[type=url], input[type=number], select {
    width: 100%; margin-top: .3rem; padding: .5rem .6rem;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 14px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: .9rem; flex-wrap: wrap; }
  .row > label { flex: 1 1 200px; }
  .check { display: flex; align-items: center; gap: .5rem; margin-top: .9rem;
           font-size: 14px; color: var(--ink); }
  .check input { margin: 0; }
  .hint { font-size: 12px; color: var(--muted); margin: .35rem 0 0; }
  button {
    font: inherit; font-size: 14px; padding: .45rem .9rem; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bar {
    position: sticky; bottom: 0; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
    padding: .75rem 1rem; display: flex; align-items: center; gap: 1rem;
  }
  .flash {
    padding: .6rem .9rem; border-radius: 8px; margin: 0 0 1rem; font-size: 14px;
    border: 1px solid var(--line); background: var(--panel);
  }
  .flash.ok  { border-color: var(--ok);  color: var(--ok); }
  .flash.bad { border-color: var(--bad); color: var(--bad); }
  .legend-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .result { font-size: 13px; margin-top: .7rem; }
  .result.ok  { color: var(--ok); }
  .result.bad { color: var(--bad); }
  .result.pending { color: var(--muted); }
  .sections { margin-top: .6rem; padding-left: .1rem; }
  .sections label {
    display: flex; align-items: center; gap: .5rem; color: var(--ink); margin: .3rem 0;
  }
  .sections .agent { color: var(--muted); font-size: 12px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }

  /* ── Library ── */
  .library { display: grid; grid-template-columns: 220px 1fr; gap: 1.5rem; align-items: start; }
  .rail {
    position: sticky; top: 1rem; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: .9rem; max-height: calc(100vh - 5rem); overflow-y: auto;
  }
  .rail input[type=search] {
    width: 100%; padding: .45rem .55rem; font: inherit; font-size: 14px;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
  }
  .facet { margin-top: 1rem; }
  .facet h3 {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 .4rem;
  }
  .facet label {
    display: flex; align-items: center; gap: .45rem; margin: .15rem 0;
    font-size: 13px; color: var(--ink); cursor: pointer;
  }
  .facet label span:first-of-type { flex: 1; overflow: hidden; text-overflow: ellipsis;
                                    white-space: nowrap; }
  .facet .n { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .rail .clear { display: inline-block; margin-top: 1rem; font-size: 13px; color: var(--accent); }
  .toolbar {
    display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
    padding-bottom: .8rem; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .toolbar .spacer { flex: 1; }
  .toolbar select { width: auto; margin: 0 0 0 .35rem; padding: .3rem .4rem; }
  .sort { display: flex; align-items: center; margin: 0; font-size: 13px; }
  .grid {
    display: grid; gap: 1rem; margin-top: 1rem;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  }
  .card h4 { font-size: 13px; margin: .45rem 0 0; font-weight: 600; line-height: 1.3; }
  .card .year { color: var(--muted); font-weight: 400; }
  .card .poster {
    position: relative; display: block; width: 100%; padding: 0; border: 0; border-radius: 8px;
    overflow: hidden; background: var(--panel); cursor: pointer; aspect-ratio: 2 / 3;
  }
  .card .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .poster:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card .pin {
    position: absolute; right: 6px; bottom: 6px; font-size: 15px; line-height: 1;
    padding: 3px 4px; border-radius: 6px; background: rgba(0,0,0,.55); opacity: .25;
  }
  .card.is-pinned .pin { opacity: 1; }
  .card.is-pinned .poster { outline: 2px solid var(--accent); outline-offset: 1px; }
  .badge { font-size: 11.5px; color: var(--muted); margin: .2rem 0 0; }
  .badge.outlook-dated { color: var(--accent); }
  .badge.outlook-dormant { color: var(--warn); }
  .badge.outlook-cancelled { color: var(--bad); }
  .pager { display: flex; align-items: center; gap: 1rem; justify-content: center;
           margin-top: 1.5rem; font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); margin-top: 2rem; }
  /* ── Calendar ── */
  .agenda { list-style: none; padding: 0; margin: 0 0 1.5rem; }
  .ep {
    display: grid; grid-template-columns: 6.5rem 1fr auto auto; gap: .75rem;
    align-items: baseline; padding: .35rem 0; border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .ep .when { color: var(--muted); font-size: 13px; }
  .ep .show { color: var(--ink); text-decoration: none; font-weight: 500; }
  .ep .show:hover { color: var(--accent); }
  .ep .code { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .ep .state { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .ep.state-available .state { color: var(--ok); }
  .ep.state-missing .state { color: var(--bad); }
  .ep.state-awaiting .state { color: var(--warn); }
  .ep.state-airing_today .state { color: var(--accent); }
  .section {
    font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin: 2rem 0 .6rem; font-weight: 600;
  }
  .section.warn { color: var(--warn); }
  .section .nav { color: var(--accent); text-decoration: none; padding: 0 .4rem; }
  .month { width: 100%; border-collapse: collapse; margin-bottom: .5rem; }
  .month th {
    font-size: 11px; color: var(--muted); font-weight: 500; padding-bottom: .3rem;
  }
  .month td {
    height: 84px; width: 14.28%; vertical-align: top; text-align: left;
    border: 1px solid var(--line); font-size: 13px; padding: .25rem .3rem;
  }
  .month .num { display: block; text-align: right; color: var(--muted); font-size: 11.5px; }
  .cell-show {
    display: block; font-size: 11.5px; line-height: 1.35; color: var(--ink);
    text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    border-left: 2px solid var(--accent); padding-left: .3rem; margin-top: .12rem;
  }
  .cell-show:hover { color: var(--accent); }
  .cell-show.state-available { border-left-color: var(--ok); }
  .cell-show.state-missing { border-left-color: var(--bad); }
  .cell-show.state-awaiting { border-left-color: var(--warn); }
  .month .more { font-size: 10.5px; color: var(--muted); padding-left: .3rem; }
  .month td.dim .num { color: var(--muted); opacity: .45; }
  .month td.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .month .dots { display: block; color: var(--accent); font-size: 9px; letter-spacing: 1px; }
  .month-list { margin-top: .75rem; }
  .month td[title] { cursor: help; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0 0 1rem; }
  .chip {
    font-size: 13px; padding: .2rem .55rem; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel);
  }
  /* ── Series detail ── */
  .crumb { margin: 0 0 1rem; font-size: 13px; }
  .crumb a { color: var(--accent); text-decoration: none; }
  .detail { display: grid; grid-template-columns: 200px 1fr; gap: 1.5rem; align-items: start; }
  .detail .art { border-radius: 8px; background: var(--panel); object-fit: cover; }
  .detail h1 { margin: 0; }
  .detail .year { color: var(--muted); font-weight: 400; }
  .detail .overview { margin: 1rem 0; max-width: 60ch; }
  .badge-lg {
    font-size: 12px; padding: .2rem .55rem; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  }
  .badge-lg.outlook-dated { color: var(--accent); border-color: var(--accent); }
  .badge-lg.outlook-dormant { color: var(--warn); border-color: var(--warn); }
  .badge-lg.outlook-cancelled { color: var(--bad); border-color: var(--bad); }
  .detail .next { color: var(--muted); font-size: 13px; margin-left: .5rem; }
  .detail .actions { margin: 1rem 0; }
  .facts { display: grid; grid-template-columns: 8rem 1fr; gap: .3rem 1rem; font-size: 13px; margin: 0; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; }
  .facts .soft { color: var(--warn); margin-left: .4rem; }
  .card h4 a { color: inherit; text-decoration: none; }
  .card h4 a:hover { color: var(--accent); }
  .card { position: relative; }
  .card .info {
    position: absolute; top: 6px; right: 6px; width: 20px; height: 20px;
    display: grid; place-items: center; border-radius: 50%;
    background: rgba(0,0,0,.6); color: #fff; font-size: 12px; font-style: italic;
    font-weight: 700; text-decoration: none; opacity: 0; transition: opacity .12s;
  }
  .card:hover .info, .card .info:focus { opacity: 1; }
  a.chip { text-decoration: none; color: var(--ink); }
  a.chip:hover { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 820px) {
    .detail { grid-template-columns: 1fr; }
    .card .info { opacity: 1; }
  }
  .dormant summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 1.5rem; }
  @media (max-width: 820px) {
    .library { grid-template-columns: 1fr; }
    .rail { position: static; max-height: none; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">PINNARR</span>
  <nav>
    <a href="/" class="{% block nav_calendar %}{% endblock %}">Calendar</a>
    <a href="/library" class="{% block nav_library %}{% endblock %}">Library</a>
    <a href="/settings" class="{% block nav_settings %}{% endblock %}">Settings</a>
    <a href="/healthz">Health</a>
  </nav>
</header>
<main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
</body>
</html>
