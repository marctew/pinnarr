<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pinnarr{% endblock %}</title>
<link rel="stylesheet" href="/static/pinnarr.css?v={{ version }}">
</head>
<body>
<header>
  <span class="brand">PINNARR</span>
  <nav>
    <a href="/" class="{% block nav_calendar %}{% endblock %}">Calendar</a>
    <a href="/ready" class="{% block nav_ready %}{% endblock %}">Ready</a>
    <a href="/downloads" class="{% block nav_downloads %}{% endblock %}">Downloads</a>
    <a href="/library" class="{% block nav_library %}{% endblock %}">Library</a>
    <a href="/discover" class="{% block nav_discover %}{% endblock %}">Discover</a>
    {% if current_user(request) and current_user(request)['role'] == 'admin' %}
      <a href="/settings" class="{% block nav_settings %}{% endblock %}">Settings</a>
    {% endif %}
    <a href="/healthz">Health</a>
  </nav>
  {% if current_user(request) %}
    <div class="who-nav">
      <a href="/profile">{{ current_user(request)['username'] }}</a>
      <form method="post" action="/logout"><button type="submit" class="linkish">Sign out</button></form>
    </div>
  {% endif %}
</header>
<main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
<!-- One menu for the whole page, wired to anything carrying data-person.
     Built here rather than per-template so the series page, the person page
     and anywhere cast turns up next all behave the same. -->
<div class="ctx" id="ctx" hidden role="menu" aria-label="Cast member"></div>
<script>
  // Requesting appears on Discover and on a person's page, and the two had
  // their own copies of this. One definition, because a second copy of a
  // handler is a copy that drifts.
  async function requestShow(id) {
    const btn = document.getElementById('req-' + id);
    if (!btn) return;
    btn.disabled = true;
    btn.textContent = 'Asking…';
    try {
      const r = await fetch('/api/request/' + id, { method: 'POST' });
      const data = await r.json();
      if (!r.ok) {
        btn.textContent = '✕ ' + (data.detail || r.status);
        btn.disabled = false;
        return;
      }
      // Replaced rather than re-enabled: asking twice is the one thing a
      // request button should make impossible.
      const note = document.createElement('p');
      note.className = 'asked';
      note.textContent = data.status;
      btn.replaceWith(note);

      // Asking created a row for it, so the title stops pointing at TMDB and
      // starts pointing at the page Pinnarr now has.
      if (data.url) {
        const card = document.getElementById('want-' + id);
        const title = card && card.querySelector('h4 a');
        if (title) {
          title.href = data.url;
          title.removeAttribute('target');
          title.removeAttribute('rel');
        }
      }
    } catch (err) {
      btn.textContent = '✕ failed';
      btn.disabled = false;
    }
  }
</script>
<script>
  (function () {
    const menu = document.getElementById('ctx');
    if (!menu) return;

    function close() { menu.hidden = true; menu.innerHTML = ''; }

    function open(x, y, name, items) {
      menu.innerHTML = '';
      const head = document.createElement('div');
      head.className = 'ctx-head';
      head.textContent = name;
      menu.append(head);
      for (const item of items) {
        const a = document.createElement('a');
        a.href = item.href;
        a.role = 'menuitem';
        a.textContent = item.label;
        if (item.external) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
        a.onclick = close;
        menu.append(a);
      }
      // Placed after measuring, so a name near the right edge does not open
      // a menu half off the screen.
      menu.hidden = false;
      const box = menu.getBoundingClientRect();
      const left = Math.min(x, window.innerWidth - box.width - 8);
      const top = Math.min(y, window.innerHeight - box.height - 8);
      menu.style.left = Math.max(8, left) + 'px';
      menu.style.top = Math.max(8, top) + 'px';
    }

    document.addEventListener('contextmenu', e => {
      const target = e.target.closest('[data-person]');
      if (!target) { close(); return; }
      e.preventDefault();

      const id = target.dataset.person;
      const name = target.dataset.personName || target.textContent.trim();
      const items = [{ label: 'Everything of yours they are in', href: '/person/' + id }];
      if (target.dataset.overseerr) {
        items.push({ label: 'Look up on Overseerr', href: target.dataset.overseerr,
                     external: true });
      }
      if (target.dataset.overseerrSearch) {
        items.push({ label: 'Search Overseerr for the name',
                     href: target.dataset.overseerrSearch, external: true });
      }
      items.push({ label: 'Open on TMDB', external: true,
                   href: 'https://www.themoviedb.org/person/' + id });
      open(e.clientX, e.clientY, name, items);
    });

    document.addEventListener('click', close);
    document.addEventListener('scroll', close, true);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  })();
</script>
</body>
</html>
