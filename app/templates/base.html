<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pinnarr{% endblock %}</title>
<link rel="stylesheet" href="/static/pinnarr.css?v={{ version }}">
</head>
<body>
<header>
  <span class="brand">PINNARR</span>
  <nav>
    <a href="/" class="{% block nav_calendar %}{% endblock %}">Calendar</a>
    <a href="/ready" class="{% block nav_ready %}{% endblock %}">Ready</a>
    <a href="/downloads" class="{% block nav_downloads %}{% endblock %}">Downloads</a>
    <a href="/library" class="{% block nav_library %}{% endblock %}">Library</a>
    <a href="/discover" class="{% block nav_discover %}{% endblock %}">Discover</a>
    {% if current_user(request) and current_user(request)['role'] == 'admin' %}
      <a href="/settings" class="{% block nav_settings %}{% endblock %}">Settings</a>
    {% endif %}
    <a href="/healthz">Health</a>
  </nav>
  {% if current_user(request) %}
    <div class="who-nav">
      <a href="/profile">{{ current_user(request)['username'] }}</a>
      <form method="post" action="/logout"><button type="submit" class="linkish">Sign out</button></form>
    </div>
  {% endif %}
</header>
<main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
</body>
</html>
